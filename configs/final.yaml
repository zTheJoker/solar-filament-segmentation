# FINAL pipeline "y4_v2_t60_s" (our final submission, Kaggle 58253542, public leaderboard 0.40): FZ_nz1's candidates and verifier, plus
#   * five context networks (ConvNeXt-T U-Nets on image + ConvNeXt map + ResNet34 map) -> 6 vote features,
#   * twenty YOLO26m-seg detectors (4 seeds x 5 folds) -> 6 agreement columns per candidate,
#   * a keep model (bagged GBM on 59 columns) that decides which candidates are kept,
#   * five instance refiners that re-draw the kept candidates the FZ verifier is least sure of,
#   * a sub-pixel shift (-0.23, +0.05) px of the maps the final masks are cut from.
# Every path is relative to the repository root unless it is absolute.
# The FILAMENT_DATA_ROOT environment variable, if set, overrides data.root.

name: y4_v2_t60_s

data:
  # Folder created by unzipping the Kaggle download (contains train/ and test/).
  root: data/MAGFiLO_1.0_Kaggle_2026
  test_images: test/test_images
  train_images: train/train_images
  train_annotations: train/MAGFiLO_1.0_Annotations_kaggle2026_train.json
  # Calendar-month folds over all 707 labelled sources (used by training and
  # by the held-out evaluation in the demo notebook).
  folds: configs/folds_full.json

weights:
  dir: weights
  # Five ConvNeXt-T U-Nets, one per fold; their maps are averaged and decoded.
  segmenters: [cnx_fold0, cnx_fold1, cnx_fold2, cnx_fold3, cnx_fold4]
  # Five small-filament specialists (ConvNeXt-T U-Nets fine-tuned from the segmenters on native 2048 crops).
  specialists: [spec_fold0, spec_fold1, spec_fold2, spec_fold3, spec_fold4]
  # Five ResNet34 U-Nets; only used for the 6 "vote" features of the verifier.
  voters: [r34_fold0, r34_fold1, r34_fold2, r34_fold3, r34_fold4]
  # Five ResNet18 crop classifiers (mean score is one verifier feature).
  crop_cnns: [crop_cnn_fz_fold0, crop_cnn_fz_fold1, crop_cnn_fz_fold2, crop_cnn_fz_fold3, crop_cnn_fz_fold4]
  # FZ verifier: 100 bagged HistGradientBoosting regressors (46 features + crop-CNN score) -> u_FZ.
  # In the final pipeline u_FZ chooses which candidates the refiner sees and which kept ones it re-draws.
  gbm: verifier_gbm_fz.pkl.gz
  # Five context networks; network k is fed the maps of segmenter k and voter k.
  context: [l2_fold0, l2_fold1, l2_fold2, l2_fold3, l2_fold4]
  # Twenty YOLO26m-seg detectors: seed s, fold k (Ultralytics checkpoints, AGPL-3.0).
  detectors: [yolo_s0_f0, yolo_s0_f1, yolo_s0_f2, yolo_s0_f3, yolo_s0_f4,
              yolo_s1_f0, yolo_s1_f1, yolo_s1_f2, yolo_s1_f3, yolo_s1_f4,
              yolo_s2_f0, yolo_s2_f1, yolo_s2_f2, yolo_s2_f3, yolo_s2_f4,
              yolo_s3_f0, yolo_s3_f1, yolo_s3_f2, yolo_s3_f3, yolo_s3_f4]
  # Keep model: 100 bagged HistGradientBoosting regressors on 46 features + crop-CNN score + 6 context votes
  # + 6 detector columns (scikit-learn 1.9.1).
  keep_gbm: keep_gbm_y4.pkl.gz
  # Five instance refiners; refiner k is fed the fused map of segmenter k + specialist k.
  refiners: [refiner_fold0, refiner_fold1, refiner_fold2, refiner_fold3, refiner_fold4]

inference:
  side: 1024            # model resolution; maps are upsampled to the native 2048
  tta: d4               # 8 dihedral views (4 rotations x horizontal flip)
  device: auto          # auto | cpu | cuda
  view_batch: 8         # how many TTA views go through a network at once
  threads: 0            # CPU threads for torch (0 = all cores)
  specialist:
    view_batch: 1       # views per forward pass at 2048 (1 keeps CPU memory near 3 GB)
    autocast: bf16      # as in the submitted run
    fusion_weight: 0.5  # fused foreground = (1 - w) * base + w * specialist
  context:
    view_batch: 1       # one TTA view per forward pass, as in the submitted run
    autocast: bf16
  detector:
    imgsz: 1536
    conf: 0.05          # confidence floor of the instances that enter the columns
    iou: 0.7            # passed to Ultralytics; YOLO26's end-to-end head does not use NMS
    max_det: 300
    groups: [5, 5, 5, 5]  # columns are averaged over each seed's five folds, then over the seeds
  refiner:
    u_min: 0.10         # every candidate with u_FZ >= u_min is refined (and enters the neighbour channel)
    flips: true         # identity, horizontal, vertical and both flips, averaged
    autocast: bf16
    batch: {A: 48, B: 12}   # crops per forward pass for the two crop sizes

candidates:
  fg_threshold: 0.4     # foreground probability threshold of the ensemble map
  min_area: 150         # native pixels; smaller connected components are dropped
  fill_holes: true

verifier:
  tau: 0.25             # keep a candidate if the keep model's u >= tau
  crop_side: 128
  cnn_batch: 512

# Post-processing. The final pipeline runs outline_nz1 on every candidate before the keep decision (the
# detector columns are measured on these outlines), and its last step is the refiner paste-back
# (filament_seg/pasteback.py), which also removes the rejected candidates.
postprocess:
  steps:
    - name: outline_nz1
      levels: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
      base_level: 0.40
      grow_px: 16
      band_px: 4
      bins: 20
      gamma: 1.0
    - name: refine_pasteback
      thr: 0.60           # refined probability threshold
      fill: true          # fill holes of the re-drawn mask
      umax: 0.55          # only kept candidates with u_FZ <= umax are re-drawn; the others keep their nz1 outline
      shift: [-0.23, 0.05]  # (dy, dx) native px applied to the maps the final masks are cut from

output:
  dir: outputs
